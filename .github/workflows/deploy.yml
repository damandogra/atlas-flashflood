# Build and publish the Atlas DSS to GitHub Pages.
# Runs on every push to main, every 6 hours (fresh forecast baked into the site), and on demand.
# Nothing is committed back to the repository: each forecast is kept as a workflow artifact.
name: Deploy Atlas DSS

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Forecast (Open-Meteo -> scenario library -> alert)
        run: |
          pip install numpy pandas requests
          python -m pipeline.forecast.live --meta web/public/data/meta.json
        continue-on-error: true   # the site still deploys with the previous forecast

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Keep this forecast for verification
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_id }}
          path: web/public/data/forecast/latest.json
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
